# 태그(v0.1.1 처럼 v 로 시작)를 올리면 Windows 설치 파일을 빌드해서 GitHub Releases 에 초안(draft)으로 올린다.
# 릴리즈는 gh 명령으로 한 번에 하나만 만든다. (파일이 여러 릴리즈로 나뉘어 올라가는 문제 방지)
# 초안은 사용자 앱에 보이지 않는다. 확인한 뒤 Releases 화면에서 "Publish release" 를 눌러야 자동 업데이트가 나간다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 릴리즈를 만들고 파일을 올리려면 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 태그와 package.json 버전이 같은지 확인
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 package.json 버전(v$version)이 다릅니다. 버전을 맞춘 뒤 태그를 다시 만드세요."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # electron-builder 가 직접 올리면 파일 3개를 동시에 올리면서 같은 태그의 릴리즈를 여러 개 만드는 문제가 있어서,
      # 빌드만 하고 업로드는 아래에서 릴리즈를 한 번에 하나만 만들면서 처리한다.
      - name: 설치 파일 빌드 (업로드 없음)
        run: npx electron-builder --win nsis --publish never

      - name: 릴리즈(초안) 한 번에 만들고 파일 3개 업로드
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 앱의 자동 업데이트에 필요한 3개 파일이 모두 있는지 먼저 확인한다.
          for f in dist/PHP-Live-Setup-*.exe dist/PHP-Live-Setup-*.exe.blockmap dist/latest.yml; do
            [ -f "$f" ] || { echo "빌드 결과에 $f 가 없습니다."; exit 1; }
          done
          git log -1 --format=%B > release-notes.md
          # 초안으로 만든다. 확인 후 GitHub 의 Releases 화면에서 Publish release 를 눌러야 사용자 앱에 업데이트가 나간다.
          gh release create "$GITHUB_REF_NAME" \
            dist/PHP-Live-Setup-*.exe dist/PHP-Live-Setup-*.exe.blockmap dist/latest.yml \
            --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
