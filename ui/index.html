<div class="app">
  <aside class="side">
    <a class="brand" href="#/projects" aria-label="PHP Live 홈">
      <svg class="mark" viewBox="140 140 965 965" aria-hidden="true">
        <rect x="305" y="305" width="790" height="790" rx="96" fill="#9FA9DB"/>
        <g fill="none" stroke="#181A40" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="75" d="M320 187H287A100 100 0 0 0 187 287V912A100 100 0 0 0 287 1012H700"/>
          <path stroke-width="75" d="M457 187H912A100 100 0 0 1 1012 287V912A100 100 0 0 1 912 1012H870"/>
          <path stroke-width="65" d="M305 720V482H362A80.5 80.5 0 0 1 362 643H305M533 482V720M673 482V720M533 594H673M755 720V482H812A80.5 80.5 0 0 1 812 643H755"/>
        </g>
      </svg>
      <span>PHP Live</span>
    </a>
    <nav class="nav" aria-label="주 메뉴">
      <a href="#/projects" data-nav="projects"><svg class="i"><use href="#i-folder"/></svg>프로젝트</a>
      <a href="#/php" data-nav="php"><svg class="i"><use href="#i-layers"/></svg>PHP 버전</a>
      <a href="#/settings" data-nav="settings"><svg class="i"><use href="#i-sliders"/></svg>전역 설정</a>
    </nav>
    <div class="side-foot">
      <div class="upd" id="upd" role="status" aria-live="polite" hidden></div>
      <div class="side-foot-label">이 컴퓨터</div>
      <div class="side-foot-val">등록된 프로젝트 <span id="side-count"></span></div>    </div>
  </aside>

  <header class="top">
    <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
    <div class="top-right">
      <span class="ver" id="ver" title="현재 설치된 버전"></span>
      <a class="gh-chip" href="#/settings" id="gh-chip"></a>
    </div>
  </header>

  <main class="sheet" id="view"></main>
</div>

<dialog id="dlg-project">
  <form method="dialog" id="f-project">
    <h2 id="dlg-project-title">프로젝트 추가</h2>
    <p class="dlg-desc">로컬 폴더를 등록하면 PHP 서버, VSCode, GitHub 작업을 이 프로젝트에서 바로 실행할 수 있습니다.</p>
    <label class="field"><span>프로젝트명</span><input name="name" required placeholder="예: 쇼핑몰 리뉴얼"></label>
    <label class="field"><span>로컬 프로젝트 경로</span>
      <span class="joined"><input name="path" class="mono" required placeholder="D:\work\my-project"><button type="button" class="btn" data-pick="folder">폴더 선택</button></span>
    </label>
    <label class="field"><span>PHP 버전</span><select name="php" id="php-select"></select></label>
    <label class="field"><span>메모</span><textarea name="memo" rows="3" placeholder="작업 범위나 주의사항을 적어 두세요."></textarea></label>
    <div class="dlg-actions"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn btn-primary">저장</button></div>
  </form>
</dialog>

<dialog id="dlg-php">
  <form method="dialog" id="f-php">
    <h2>PHP 추가</h2>
    <p class="dlg-desc">설치된 <span class="mono">php.exe</span> 경로를 고르면 버전을 자동으로 읽어옵니다.</p>
    <label class="field"><span>php.exe 경로</span>
      <span class="joined"><input name="path" class="mono" required placeholder="D:\php\8.3.12\php.exe"><button type="button" class="btn" data-pick="exe">찾아보기</button></span>
    </label>
    <label class="field"><span>확인된 버전</span><input name="version" class="mono" readonly placeholder="경로를 입력하면 자동으로 채워집니다"></label>
    <div class="dlg-actions"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn btn-primary">저장</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
